name: personnal cloud

services:
  # Note: MariaDB is an external service. You can find more information about the configuration here:
  # https://hub.docker.com/_/mariadb
  db:
    # Note: Check the recommend version here: https://docs.nextcloud.com/server/latest/admin_manual/installation/system_requirements.html#server
    container_name: ${PROJECT_NAME}_DB
    image: mariadb:lts
    restart: always
    command: --transaction-isolation=READ-COMMITTED
    volumes:
      - ../../data/mysql:/var/lib/mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    env_file:
      - db.env
    networks:
      - personal_cloud
    # Sécurité : pas d'exposition directe de la base de données
    expose:
      - "3306"

  redis:
    image: redis:latest
    container_name: ${PROJECT_NAME}_REDIS
    hostname: redis
    ports:
      - 6379:6379
    volumes:
      - ../../data/redis:/data
      - ./redis/redis.conf:/redis.conf
    command: [ "redis-server", "/redis.conf" ]
    networks:
      - personal_cloud
    expose:
      - "6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ${PROJECT_NAME}_REDIS_INSIGHT
    restart: unless-stopped
    volumes:
      - ../../data/redis-insight:/data
    ports:
      - 5540:5540
    networks:
      - personal_cloud
    depends_on:
      - redis

  app:
    container_name: ${PROJECT_NAME}_APP
    build: ./fpm-alpine/.
    restart: always
    depends_on:
      - redis
      - db
    volumes:
      - ../../www/nextcloud:/var/www/html:rw
      - ../../www/data/nextcloud:/var/www/html/data:rw
      - ../../data/logs:/var/log:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SERVER_NAME=${SERVER_NAME}
    networks:
      - personal_cloud
    env_file:
      - ../../www/.cloudenv
      - db.env
    # Sécurité : pas d'exposition directe de l'application PHP
    expose:
      - "9000"

  # Note: Nginx is an external service. You can find more information about the configuration here:
  # https://hub.docker.com/_/nginx/
  #######################################
  # NGINX
  #######################################
  nginx:
    build: ./nginx/.
    container_name: ${PROJECT_NAME}_NGINX
    restart: always
    ports:
      # Configuration pour accès externe
      - '80:80'      # HTTP
      - '443:443'    # HTTPS
      # Alternative : utiliser des ports personnalisés si 80/443 sont occupés
      # - '8080:80'   # HTTP sur port 8080
      # - '8443:443'  # HTTPS sur port 8443
    volumes:
      - ../../www/nextcloud:/var/www/html
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
      - ../../data/logs/nginx:/var/log/nginx
    depends_on:
      - app
    volumes_from:
      - app
    networks:
      - personal_cloud

  #######################################
  # Phpmyadmin
  #######################################
  phpmyadmin:
    container_name: ${PROJECT_NAME}_PHPMYADMIN
    image: phpmyadmin/phpmyadmin
    ports:
      # Configuration pour accès externe sécurisé
      - "8081:80"
      # Alternative : utiliser un port différent pour plus de sécurité
      # - "9090:80"
    depends_on:
      - db
    networks:
      - personal_cloud
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_USER}
      - PMA_PASSWORD=${MYSQL_PASSWORD}
    expose:
      - "8081"

networks:
  personal_cloud:
    external: true
