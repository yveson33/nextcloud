
services:
  portainer:
    container_name: ${PROJECT_NAME}_PORTAINER
    image: portainer/portainer-ce:latest
    ports:
      - 9443:9443
    expose:
      - 9443
    volumes:
      - $PWD/data/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - personal_cloud
    
networks:
  personal_cloud:
    external: true