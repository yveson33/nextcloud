
services:
  portainer:
    container_name: ${PROJECT_NAME}_PORTAINER
    image: portainer/portainer-ce:latest
    ports:
      - 9443:9443
    expose:
      - 9443
    volumes:
      # Chemin relatif et non $PWD : Compose le résout par rapport au
      # répertoire de ce fichier, alors que $PWD dépend du répertoire courant de
      # l'appelant. cloud_services.py lançant "docker compose -f <chemin absolu>"
      # depuis la racine du dépôt, $PWD pointait à côté et Portainer démarrait
      # avec une configuration vierge.
      - ./data/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - personal_cloud
    
networks:
  personal_cloud:
    external: true