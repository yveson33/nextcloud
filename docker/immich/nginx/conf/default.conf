# Reverse proxy TLS devant Immich.
# Le serveur Immich reste en HTTP sur le réseau interne personal_cloud ;
# seul nginx est exposé, en HTTPS.

upstream immich {
    server NEXTCLOUD_IMMICH_IMMICH_SERVER:2283;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443      ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Immich accepte des vidéos très volumineuses (jusqu'à ~1 Go par fichier
    # dans cette bibliothèque) : sans cette valeur nginx renvoie 413.
    client_max_body_size 50000M;

    # Les imports longs ne doivent pas être coupés par le proxy.
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;

    # Immich diffuse la vidéo et pousse des évènements : pas de mise en tampon.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://immich;
        proxy_http_version 1.1;

        # Websocket (socket.io) : sans ces deux en-têtes l'interface ne reçoit
        # plus les mises à jour temps réel.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
