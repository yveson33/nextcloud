#
# WARNING: To install Immich, follow our guide: https://immich.app/docs/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    container_name: ${PROJECT_NAME}_IMMICH_SERVER
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?IMMICH_VERSION doit etre epingle dans .env}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - $PWD/www/immich/machine_server:/data
      - /etc/localtime:/etc/localtime:ro
      # Bibliothèque externe : Immich indexe ces fichiers sur place, sans les
      # copier. Monté en lecture seule pour qu'il ne puisse jamais les modifier.
      - ${EXTERNAL_MEDIA_PATH:-/home/yves/media/photos}:/mnt/media:ro
    ports:
      - '2283:2283'
    depends_on:
      - database
      - redis
    restart: always
    healthcheck:
      disable: false
    networks:
      - personal_cloud
    # Redis dédié à Immich (la stack Nextcloud est désormais arrêtée)
    environment:
      REDIS_HOSTNAME: ${PROJECT_NAME}_immich_redis
      REDIS_PASSWORD: ${NEXTCLOUD_REDIS_PASSWORD}

  immich-machine-learning:
    container_name: ${PROJECT_NAME}_immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:?IMMICH_VERSION doit etre epingle dans .env}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?IMMICH_VERSION doit etre epingle dans .env}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - $PWD/www/immich/machine_learning:/cache
    restart: always
    healthcheck:
      disable: false
    networks:
      - personal_cloud

  nginx:
    build: ./nginx/.
    container_name: ${PROJECT_NAME}_immich_nginx
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - immich-server
    restart: always
    networks:
      - personal_cloud

  redis:
    container_name: ${PROJECT_NAME}_immich_redis
    image: redis:latest
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDISCLI_AUTH" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDISCLI_AUTH: ${NEXTCLOUD_REDIS_PASSWORD}
    restart: always
    networks:
      - personal_cloud

  database:
    container_name: ${PROJECT_NAME}_immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - $PWD/data/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks:
      - personal_cloud

networks:
  personal_cloud:
    external: true