[defaults]
# Fichier de configuration Ansible pour le projet Nextcloud

# Chemin vers l'inventory
inventory = inventory/hosts.yml

# Chemin vers les rôles
roles_path = roles

# Chemin vers les playbooks
playbook_dir = playbooks

# Fichiers de variables
hostfile = inventory/hosts.yml
host_key_checking = False
remote_user = root

# Chemins de recherche
library = library
module_utils = module_utils

# Logs et verbosité
log_path = logs/ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# Timeouts
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Performance
forks = 5
host_key_checking = False
pipelining = True

# Retry
retry_files_enabled = False

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
