---
# Rôle Docker - Installation et configuration de Docker et Docker Compose

- name: Vérifier si Docker est installé
  command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Installer les dépendances système
  package:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  when: ansible_os_family == "Debian" and docker_check.rc != 0

- name: Ajouter la clé GPG de Docker
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    state: present
  when: ansible_os_family == "Debian" and docker_check.rc != 0

- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
  when: ansible_os_family == "Debian" and docker_check.rc != 0

- name: Installer Docker
  package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian" and docker_check.rc != 0

- name: Installer Docker via Homebrew (macOS)
  homebrew:
    name:
      - docker
      - docker-compose
    state: present
  when: ansible_os_family == "Darwin" and docker_check.rc != 0

- name: Démarrer et activer Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  when: ansible_os_family != "Darwin"

- name: Ajouter l'utilisateur au groupe docker
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  when: ansible_os_family != "Darwin"

- name: Vérifier la version de Docker
  command: docker --version
  register: docker_version_result
  changed_when: false

- name: Afficher la version de Docker
  debug:
    msg: "Docker installé: {{ docker_version_result.stdout }}"

- name: Vérifier la version de Docker Compose
  command: docker compose version
  register: docker_compose_version_result
  changed_when: false

- name: Afficher la version de Docker Compose
  debug:
    msg: "Docker Compose installé: {{ docker_compose_version_result.stdout }}"

- name: Créer le réseau Docker personnalisé
  docker_network:
    name: "{{ docker_network_name }}"
    driver: "{{ docker_network_driver | default('bridge') }}"
    ipam_config:
      - subnet: "{{ docker_network_subnet | default('172.20.0.0/16') }}"
    state: present
