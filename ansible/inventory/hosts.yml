---
# Inventory Ansible pour l'infrastructure Nextcloud
# Configuration des hosts et groupes

all:
  children:
    docker_hosts:
      hosts:
        localhost:
          ansible_connection: local
          ansible_host: 127.0.0.1
        # Ajoutez vos serveurs distants ici :
        # server1:
        #   ansible_host: 192.168.1.100
        #   ansible_user: deploy
        #   ansible_ssh_private_key_file: ~/.ssh/id_rsa
      vars:
        # Variables communes à tous les hosts Docker
        docker_compose_version: "2.24.0"
        docker_network_name: "personal_cloud"
        
    nextcloud_servers:
      hosts:
        localhost:
      vars:
        project_name: "nextcloud"
        nextcloud_version: "latest"
        
    portainer_servers:
      hosts:
        localhost:
      vars:
        portainer_version: "latest"
        
    immich_servers:
      hosts:
        localhost:
      vars:
        immich_version: "release"
